<template>
    <lightning-card title="Track Your Shipment" icon-name="standard:delivery">
        <div class="slds-p-around_medium">
            <lightning-input label="Tracking Number (e.g. SHP-0002)" value={trackingNumber} onchange={handleChange}></lightning-input>
            <lightning-button class="slds-m-top_small" label="Track" variant="brand" onclick={handleTrack}></lightning-button>

            <template if:true={shipment}>
                <div class="slds-m-top_medium">
                    <p><b>Tracking No:</b> {shipment.Name}</p>
                    <p><b>Status:</b> {shipment.Status__c}</p>
                    <p><b>From:</b> {shipment.Origin_City__c}</p>
                    <p><b>To:</b> {shipment.Destination_City__c}</p>
                    <p><b>Expected Delivery:</b> {shipment.Expected_Delivery_Date__c}</p>
                    <p><b>Delay Reason:</b> {shipment.Delay_Reason__c}</p>
                </div>
            </template>

            <template if:true={error}>
                <p class="slds-m-top_medium slds-text-color_error">{error}</p>
            </template>
        </div>
    </lightning-card>
</template>
