name: Salesforce CI

on:
  push:
    branches: [ main, devops-pipeline ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Log in to the org
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > auth.txt
          sf org login sfdx-url --sfdx-url-file auth.txt --alias devorg
          rm auth.txt

      - name: Validate deployment and run Apex tests
        run: >
          sf project deploy start --dry-run --target-org devorg
          --source-dir force-app
          --test-level RunSpecifiedTests
          --tests CaseTriggerHandlerTest
          --tests ShipmentTrackerControllerTest
          --tests DelayedShipmentBatchTest
          --wait 20